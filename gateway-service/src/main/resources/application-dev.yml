server:
  port: 80

spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true # 开启从注册中心根据服务名动态路由
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  redis:
    host: localhost

redis:
  starter:
    enable: true


jwt:
  secret: Rd47dBEohqeWgMtNsc/RN42ZIjpVU+lqRO9mb+LNpUg=
  # AccessToken 过期时间（单位：毫秒），这里设为 2 小时
  access-token-expiration: 7200000
  # RefreshToken 过期时间（单位：毫秒），这里设为 7 天
  refresh-token-expiration: 604800000
